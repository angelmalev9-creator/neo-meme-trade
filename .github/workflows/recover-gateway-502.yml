name: Recover gateway after 502
on:
  push:
    branches: [fix/gateway-recovery-20261018]
permissions:
  contents: write
jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gateway-recovery-20261018
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply gateway recovery marker and sync strategy lock
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          gateway = Path('backend/user_gateway.py')
          text = gateway.read_text(encoding='utf-8').replace('\r\n', '\n')
          marker = 'GATEWAY_RECOVERY_REVISION = "2026-10-18_502_UPSTREAM_RECOVERY"\n'
          if marker not in text:
              needle = 'AUTH_CACHE_SECONDS = max(0.0, float(os.getenv("NEO_USER_AUTH_CACHE_SECONDS", "30")))\n'
              if needle not in text:
                  raise SystemExit('gateway marker insertion point not found')
              text = text.replace(needle, needle + marker, 1)
              gateway.write_text(text, encoding='utf-8', newline='\n')

          data = gateway.read_text(encoding='utf-8').replace('\r\n', '\n').encode('utf-8')
          digest = hashlib.sha256(data).hexdigest()
          lock_path = Path('strategy-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock.setdefault('support_files_sha256', {})['backend/user_gateway.py'] = digest
          reasons = lock.setdefault('hash_change_reasons', {})
          note = ('2026-10-18: recovery-only gateway revision marker to force a clean systemd restart after the public nginx endpoint returned HTTP 502; '
                  'no authentication, account isolation, CORS, trading, sizing, entry, exit, risk or execution logic changed.')
          old = str(reasons.get('backend/user_gateway.py') or '').strip()
          if note not in old:
              reasons['backend/user_gateway.py'] = (old + (' ' if old else '') + note)
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          print('gateway_sha256', digest)
          PY
      - name: Verify recovery patch
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile backend/user_gateway.py
          python scripts/verify_strategy_lock.py
          python -m unittest discover -s tests -p 'test_gateway_isolation.py' -v
      - name: Commit recovery patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/recover-gateway-502.yml
          git config user.name 'neo-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/user_gateway.py strategy-lock.json .github/workflows/recover-gateway-502.yml
          git commit -m 'Recover user gateway from 502 upstream outage'
          git push origin HEAD:fix/gateway-recovery-20261018
