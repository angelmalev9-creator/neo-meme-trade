name: Recover gateway 502 v2
on:
  push:
    branches: [fix/gateway-502-restart-v2]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gateway-502-restart-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Force clean gateway restart and sync lock
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          gateway = Path('backend/user_gateway.py')
          text = gateway.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = 'GATEWAY_RECOVERY_REVISION = "2026-10-18_502_UPSTREAM_RECOVERY"'
          new = 'GATEWAY_RECOVERY_REVISION = "2026-10-18_502_GATEWAY_FORCE_RESTART_V2"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('gateway recovery marker not found')
          gateway.write_text(text, encoding='utf-8', newline='\n')

          digest = hashlib.sha256(gateway.read_bytes()).hexdigest()
          lock_path = Path('strategy-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock.setdefault('support_files_sha256', {})['backend/user_gateway.py'] = digest
          reasons = lock.setdefault('hash_change_reasons', {})
          note = ('2026-10-18: gateway-only force-restart marker after public nginx returned HTTP 502; '
                  'no authentication, account isolation, CORS, trading, sizing, entry, exit, risk or execution logic changed.')
          previous = str(reasons.get('backend/user_gateway.py') or '').strip()
          if note not in previous:
              reasons['backend/user_gateway.py'] = previous + (' ' if previous else '') + note
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          print('gateway_sha256', digest)
          PY
      - name: Verify
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile backend/user_gateway.py
          python scripts/verify_strategy_lock.py
          python -m unittest tests.test_gateway_isolation -v
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/recover-gateway-502-v2.yml
          git config user.name 'neo-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/user_gateway.py strategy-lock.json .github/workflows/recover-gateway-502-v2.yml
          git commit -m 'Force clean user gateway restart after 502'
          git push origin HEAD:fix/gateway-502-restart-v2
