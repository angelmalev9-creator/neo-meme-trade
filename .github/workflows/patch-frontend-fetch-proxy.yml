name: Patch frontend fetch proxy
on:
  push:
    branches: [fix/frontend-fetch-proxy-20261018]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-fetch-proxy-20261018
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch API client
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = "const API = 'https://neo-meme-api.169-58-211-177.sslip.io';"
          new = """const DIRECT_API = 'https://neo-meme-api.169-58-211-177.sslip.io';
const PROXY_API = typeof window !== 'undefined' && window.location.hostname.endsWith('.vercel.app')
  ? `${window.location.origin}/api/proxy`
  : 'https://neo-meme-trade.vercel.app/api/proxy';

async function resilientApiFetch(path: string, init: RequestInit = {}): Promise<Response> {
  const controller = new AbortController();
  const timer = window.setTimeout(() => controller.abort(), 1200);
  try {
    const response = await fetch(`${DIRECT_API}${path}`, { ...init, signal: controller.signal });
    if (![502, 503, 504].includes(response.status)) return response;
  } catch {
    // Direct browser access can be blocked by DNS/CORS/network policy; use the stable Vercel relay.
  } finally {
    window.clearTimeout(timer);
  }
  return fetch(`${PROXY_API}?path=${encodeURIComponent(path)}`, init);
}"""
          if old not in s:
              raise SystemExit('API constant not found')
          s = s.replace(old, new, 1)
          s = s.replace("await fetch(`${API}${path}`,", "await resilientApiFetch(path,", 2)
          if "`${API}${path}`" in s:
              raise SystemExit('old API fetch still present')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-frontend-fetch-proxy.yml
          git config user.name 'neo-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx .github/workflows/patch-frontend-fetch-proxy.yml
          git commit -m 'Use resilient API proxy fallback in dashboard'
          git push origin HEAD:fix/frontend-fetch-proxy-20261018
