name: NEO Selective Early PAPER research
on:
  push:
    paths:
      - "scripts/neo_selective_shadow_paper.py"
      - "scripts/test_neo_selective_shadow_paper.py"
      - ".github/workflows/neo-shadow-paper.yml"
  pull_request:
    paths:
      - "scripts/neo_selective_shadow_paper.py"
      - "scripts/test_neo_selective_shadow_paper.py"
      - ".github/workflows/neo-shadow-paper.yml"

permissions:
  contents: read

jobs:
  shadow-causality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile scripts/neo_selective_shadow_paper.py scripts/test_neo_selective_shadow_paper.py
      - run: python3 -m unittest discover -s scripts -p test_neo_selective_shadow_paper.py -v
