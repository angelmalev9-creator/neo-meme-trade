name: Apply Momentum Hunter Paper Patch

on:
  push:
    branches:
      - feat/momentum-hunter-paper

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/momentum-hunter-paper
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply surgical PAPER-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # PAPER Strategy Lab activity policy only. No live engine files are touched.
          replace_once(
              'backend/lab_activity.py',
              "POLICY_VERSION = 'LAB_ACTIVE_V2'",
              "POLICY_VERSION = 'LAB_ACTIVE_V3_MOMENTUM_HUNTER'",
          )
          replace_once(
              'backend/lab_activity.py',
              "    'MOMENTUM': EntryRule(85, 15000, (3, 40), 1.05, .06, (2, 720)),\n",
              "    'MOMENTUM': EntryRule(85, 15000, (3, 40), 1.05, .06, (2, 720)),\n"
              "    # Broader PAPER-only momentum funnel; global feed/price/cost safety stays unchanged.\n"
              "    'MOMENTUM_HUNTER': EntryRule(78, 10000, (.5, 45), .90, .03, (2, 1440), (-35, 350), (.03, 1000)),\n",
          )
          replace_once(
              'backend/lab_activity.py',
              "}\n\n\ndef cooldown_remaining_ms(book: dict, address: str, now: int) -> int:\n",
              "}\n\n\n"
              "MOMENTUM_HUNTER_MIN_RANK = 32.0\n\n\n"
              "def momentum_hunter_rank(f: dict[str, Any], entry_cost_pct: float = 0.0) -> float:\n"
              "    \"\"\"Rank broad PAPER momentum candidates using current/past-only features.\"\"\"\n"
              "    flow = f.get('flow') or {}\n\n"
              "    def clamp01(value: float) -> float:\n"
              "        return max(0.0, min(1.0, number(value)))\n\n"
              "    score = clamp01((number(f.get('score')) - 70.0) / 30.0)\n"
              "    m5 = number(f.get('m5'))\n"
              "    momentum = clamp01(m5 / 12.0) if m5 <= 12 else clamp01(1.0 - (m5 - 12.0) / 38.0)\n"
              "    trend = clamp01((number(f.get('h1')) + 20.0) / 100.0)\n"
              "    buy_sell = clamp01((number(f.get('bs')) - .80) / 1.20)\n"
              "    flow_ratio = clamp01((number(flow.get('ratio')) - .80) / 2.20)\n"
              "    tape = clamp01(number(flow.get('trades')) / 10.0)\n"
              "    wallets = clamp01(number(flow.get('unique_wallets')) / 6.0)\n"
              "    volume = clamp01(number(f.get('vol_liq')) / .50)\n"
              "    lmc = clamp01(number(f.get('lmc')) / .15)\n"
              "    cost = clamp01((MAX_ENTRY_COST_PCT + number(entry_cost_pct)) / MAX_ENTRY_COST_PCT)\n\n"
              "    buy_usd = number(flow.get('buy_usd'))\n"
              "    max_sell = number(flow.get('max_sell'))\n"
              "    sell_pressure = clamp01(max_sell / max(buy_usd, 1.0))\n\n"
              "    rank = (\n"
              "        .17 * score + .20 * momentum + .08 * trend + .12 * buy_sell\n"
              "        + .14 * flow_ratio + .08 * tape + .06 * wallets + .05 * volume\n"
              "        + .04 * lmc + .06 * cost - .08 * sell_pressure\n"
              "    )\n"
              "    return round(max(0.0, min(1.0, rank)) * 100.0, 4)\n\n\n"
              "def cooldown_remaining_ms(book: dict, address: str, now: int) -> int:\n",
          )

          replace_once(
              'backend/strategy_lab.py',
              " {'id':'MOMENTUM','name':'Momentum','rule':lambda f: f['score']>=90 and f['liq']>=15000 and 5<=f['m5']<=30 and f['bs']>=1.15 and f['lmc']>=.08 and 3<=f['age']<=300},\n",
              " {'id':'MOMENTUM','name':'Momentum','rule':lambda f: f['score']>=90 and f['liq']>=15000 and 5<=f['m5']<=30 and f['bs']>=1.15 and f['lmc']>=.08 and 3<=f['age']<=300},\n"
              " {'id':'MOMENTUM_HUNTER','name':'Momentum Hunter','rule':lambda f: f['score']>=78 and f['liq']>=10000 and .5<=f['m5']<=45 and f['bs']>=.90 and f['lmc']>=.03 and 2<=f['age']<=1440 and -35<=f['h1']<=350 and f['vol_liq']>=.03},\n",
          )
          replace_once(
              'backend/strategy_lab.py',
              "assert set(activity.RULES)=={s['id'] for s in STRATEGIES}, 'All 33 entries need a policy'",
              "assert set(activity.RULES)=={s['id'] for s in STRATEGIES}, 'All 34 entries need a policy'",
          )
          replace_once(
              'backend/strategy_lab.py',
              "        blocked_cooldown=0\n",
              "        blocked_cooldown=0\n        blocked_rank=0\n",
          )
          replace_once(
              'backend/strategy_lab.py',
              "            eligible.append((proposed['initial_pnl_pct'],num(features.get('score')),\n                             coin,features,proposed))\n",
              "            if strategy['id']=='MOMENTUM_HUNTER':\n"
              "                priority=activity.momentum_hunter_rank(features,proposed['initial_pnl_pct'])\n"
              "                if priority < activity.MOMENTUM_HUNTER_MIN_RANK:\n"
              "                    blocked_rank+=1\n"
              "                    continue\n"
              "                tiebreak=proposed['initial_pnl_pct']\n"
              "            else:\n"
              "                priority=proposed['initial_pnl_pct']\n"
              "                tiebreak=num(features.get('score'))\n"
              "            eligible.append((priority,tiebreak,coin,features,proposed))\n",
          )
          replace_once(
              'backend/strategy_lab.py',
              "            'price_verification_rejected':blocked_price,\n",
              "            'price_verification_rejected':blocked_price,\n"
              "            'rank_rejected':blocked_rank,\n"
              "            'selection_mode':'MOMENTUM_HUNTER_RANK_V1' if strategy['id']=='MOMENTUM_HUNTER' else 'LOWEST_COST_THEN_SCORE',\n",
          )
          replace_once(
              'backend/strategy_lab.py',
              "        # Unified 3:10 NET exit framework across all 33 strategies.\n",
              "        # Unified 3:10 NET exit framework across all 34 strategies.\n",
          )

          replace_once(
              'tests/test_lab_activity.py',
              "    def test_all_33_rules_exist(self):\n        self.assertEqual(len(a.RULES),33)\n",
              "    def test_all_34_rules_exist(self):\n        self.assertEqual(len(a.RULES),34)\n",
          )
          replace_once(
              'tests/test_lab_activity.py',
              "        for rule in a.RULES.values():self.assertGreaterEqual(rule.liquidity,10000)\n\n    def test_every_strategy_can_match_its_family(self):\n",
              "        for rule in a.RULES.values():self.assertGreaterEqual(rule.liquidity,10000)\n\n"
              "    def test_momentum_hunter_broad_but_quality_ranked(self):\n"
              "        broad={'score':80,'liq':12000,'m5':4,'h1':20,'bs':1.0,'lmc':.05,\n"
              "               'age':600,'vol_liq':.12,\n"
              "               'flow':{'trades':2,'ratio':1.0,'buy_usd':80,'sell_usd':60,\n"
              "                       'unique_wallets':1,'max_sell':60}}\n"
              "        self.assertTrue(a.RULES['MOMENTUM_HUNTER'].matches(broad))\n"
              "        self.assertFalse(a.RULES['MOMENTUM'].matches(broad))\n\n"
              "        strong={**broad,'score':86,'m5':7,'bs':1.4,'vol_liq':.30,\n"
              "                'flow':{'trades':8,'ratio':2.4,'buy_usd':600,'sell_usd':150,\n"
              "                        'unique_wallets':5,'max_sell':60}}\n"
              "        weak={**broad,'flow':{'trades':3,'ratio':.2,'buy_usd':50,'sell_usd':250,\n"
              "                              'unique_wallets':1,'max_sell':220}}\n"
              "        self.assertGreater(a.momentum_hunter_rank(strong,-.5),a.MOMENTUM_HUNTER_MIN_RANK)\n"
              "        self.assertLess(a.momentum_hunter_rank(weak,-.5),a.MOMENTUM_HUNTER_MIN_RANK)\n\n"
              "    def test_every_strategy_can_match_its_family(self):\n",
          )
          replace_once(
              'tests/test_lab_activity.py',
              "    def test_net_stop_all_33_no_loss_clamping(self):\n",
              "    def test_net_stop_all_34_no_loss_clamping(self):\n",
          )
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate PAPER strategy lab
        env:
          PYTHONPATH: backend
        run: |
          python -m compileall -q backend
          python -m unittest discover -s tests -p 'test_lab_activity.py' -v

      - name: Commit validated patch
        run: |
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/lab_activity.py backend/strategy_lab.py tests/test_lab_activity.py
          git commit -m 'feat: add paper momentum hunter strategy'
          git push origin HEAD:feat/momentum-hunter-paper
