name: Deploy NEO Meme Trade

# Vercel is the primary host (see docs/HOSTING_VERCEL.md). GitHub Pages is
# deployed too, so the older address keeps showing the current dashboard.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neo-meme-trade-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Install PAPER backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Python backend syntax
        run: |
          python3 -m py_compile backend/*.py
          python3 scripts/run_python_checks.py

      - name: Type check frontend
        run: npm run lint

      - name: Build and verify strategy lock
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
